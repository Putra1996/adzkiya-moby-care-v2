<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Adzkiya Mom Baby Care - Safe Backup & Auto-Fit Excel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* --- Clean & Crisp UI Theme --- */
        * { 
            box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        :root {
            --theme-color: #FF5A79; 
            --theme-glow: rgba(255, 90, 121, 0.2);
            --bg-gradient: linear-gradient(135deg, #090615 0%, #0f0b21 40%, #1a0816 80%, #0b081d 100%);
            --card-bg: rgba(20, 16, 36, 0.8); 
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF; 
            --text-sub: #E2E8F0;  
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.2); 
            --item-hover: rgba(255, 255, 255, 0.1);
            --item-border: rgba(255, 255, 255, 0.12);
            --shadow-fluid: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            --tab-bg: rgba(255, 255, 255, 0.05);
            --watermark-opacity: 0.04;
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #e6edf5 0%, #d5e0eb 40%, #fbcfe8 80%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.85); 
            --card-border: rgba(0, 0, 0, 0.12);
            --text-main: #111827; 
            --text-sub: #374151;  
            --input-bg: rgba(0, 0, 0, 0.04);
            --input-border: rgba(0, 0, 0, 0.15); 
            --item-hover: rgba(0, 0, 0, 0.04);
            --item-border: rgba(0, 0, 0, 0.06);
            --shadow-fluid: 0 30px 60px rgba(15, 23, 42, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.8);
            --tab-bg: rgba(0, 0, 0, 0.04);
            --watermark-opacity: 0.07;
        }

        body { 
            background: var(--bg-gradient); 
            min-height: 100vh;
            padding: 40px 20px; 
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 25px;
            transition: background 0.5s ease;
        }

        .container, .recap-container { 
            position: relative; 
            background: var(--card-bg); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px; 
            padding: 30px 24px; 
            box-shadow: var(--shadow-fluid);
            width: 100%;
            max-width: 440px; 
            transition: background 0.4s ease, border 0.4s ease;
        }

        .ui-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px; 
            height: 260px;
            object-fit: contain;
            opacity: var(--watermark-opacity);
            pointer-events: none; 
            z-index: 0;
        }

        .brand-section, .color-palette, .form-group, .live-total-panel, .btn-block, .recap-content {
            position: relative;
            z-index: 1;
        }

        .brand-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h2 { 
            font-size: 20px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
        }
        h2 .accent-part { color: var(--theme-color); }
        h2 .neutral-part { color: var(--text-main); margin-left: 4px; font-weight: 700; }

        .mode-toggle {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            cursor: pointer;
            font-size: 16px;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .mode-toggle:hover { transform: scale(1.05); }

        .color-palette {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: var(--input-bg);
            padding: 5px;
            border-radius: 14px;
            border: 1px solid var(--input-border);
        }
        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .color-dot.active { border-color: var(--text-main); box-shadow: 0 0 8px var(--theme-glow); }

        .form-group { margin-bottom: 16px; }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 700; 
            font-size: 12px; 
            color: var(--text-sub); 
            letter-spacing: 0.3px;
        }
        
        input[type="text"], input[type="tel"], input[type="number"], input[type="file"] { 
            width: 100%; 
            padding: 12px 14px; 
            background: var(--input-bg);
            border: 1px solid var(--input-border); 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-main);
            outline: none; 
            transition: all 0.3s ease;
        }
        input[type="file"] { padding: 9px; font-size: 12px; cursor: pointer; }
        input:focus { 
            border-color: var(--theme-color); 
            box-shadow: 0 0 0 3px var(--theme-glow);
        }

        .category-tabs {
            display: flex;
            background: var(--tab-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--input-border);
            margin-bottom: 10px;
            overflow-x: auto;
            gap: 4px;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            flex: 0 0 auto;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700; 
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--text-main);
            color: #110e20;
        }
        body.light-mode .tab-btn.active {
            background: #111827;
            color: #FFFFFF;
        }

        .scroll-wrapper { position: relative; width: 100%; }
        .service-list { 
            max-height: 180px; 
            overflow-y: auto; 
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px; 
            padding: 4px 0;
            padding-right: 40px; 
        }
        .service-list::-webkit-scrollbar { display: none; } 
        .menu-pane { display: none; }
        .menu-pane.active { display: block; }

        .scroll-navigation-panel {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
        }
        .scroll-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .scroll-btn:hover { background: var(--theme-color); color: white; }

        .service-item { 
            display: flex; 
            align-items: center; 
            padding: 11px 14px; 
            border-bottom: 1px solid var(--item-border); 
            cursor: pointer;
            width: 100%;
        }
        .service-item:hover { background: var(--item-hover); }
        .service-item.selected { background: rgba(255, 255, 255, 0.12); }
        body.light-mode .service-item.selected { background: rgba(0, 0, 0, 0.05); }
        .service-item:last-child { border-bottom: none; }
        
        input[type="checkbox"] { 
            width: 18px; 
            height: 18px; 
            margin-right: 12px; 
            accent-color: var(--theme-color); 
            cursor: pointer;
            flex-shrink: 0;
        }
        .service-item span { 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-main); 
        }

        .live-total-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 15px 0;
            padding: 0 2px;
        }
        .live-total-label { font-size: 11px; color: var(--text-sub); text-transform: uppercase; font-weight: 700; }
        .live-total-value { font-size: 22px; font-weight: 800; color: var(--text-main); }

        button.btn-block { 
            width: 100%; 
            background: linear-gradient(180deg, var(--theme-color) 0%, rgba(244, 63, 94, 1) 100%);
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 14px; 
            cursor: pointer; 
            box-shadow: 0 10px 20px var(--theme-glow);
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }
        button.btn-block:hover { transform: translateY(-1px); opacity: 0.95; }
        button.btn-block:active { transform: scale(0.99); }
        
        button.btn-secondary {
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--input-border);
            box-shadow: none;
        }
        button.btn-secondary:hover { background: var(--item-hover); }

        /* --- Recap Styles --- */
        .recap-container { padding: 22px 20px; }
        .recap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .recap-header h3 { font-size: 15px; font-weight: 800; }
        .recap-action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .recap-list {
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .recap-list::-webkit-scrollbar { width: 4px; }
        .recap-list::-webkit-scrollbar-thumb { background: var(--input-border); border-radius: 4px; }
        
        .recap-item {
            background: var(--input-bg);
            border: 1px solid var(--item-border);
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            position: relative;
        }
        .recap-item .name { font-weight: 700; color: var(--text-main); margin-bottom: 3px; }
        .recap-item .details { color: var(--text-sub); opacity: 0.85; font-size: 11px; margin-bottom: 2px; }
        .recap-item .price { font-weight: 800; color: var(--theme-color); text-align: right; margin-top: 4px; font-size: 13px; }
        .btn-delete {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            color: #f43f5e;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .security-section {
            border-top: 1px dashed var(--input-border);
            margin-top: 12px;
            padding-top: 12px;
            display: flex;
            gap: 6px;
            justify-content: space-between;
        }
        .hidden-file-input { display: none; }
    </style>
</head>
<body>

<div class="container">
    <img class="ui-watermark" id="uiWatermarkView" src="" alt="" style="display: none;">

    <div class="brand-section">
        <h2><span class="accent-part">Adzkiya</span><span class="neutral-part">Mom Baby Care</span></h2>
        <button class="mode-toggle" onclick="toggleUIVisualMode()">🌓</button>
    </div>

    <div class="color-palette">
        <div class="color-dot active" style="background: #FF5A79;" onclick="changeUITheme('#FF5A79', 'rgba(255, 90, 121, 0.2)', this)"></div>
        <div class="color-dot" style="background: #2DD4BF;" onclick="changeUITheme('#2DD4BF', 'rgba(45, 212, 191, 0.2)', this)"></div>
        <div class="color-dot" style="background: #3B82F6;" onclick="changeUITheme('#3B82F6', 'rgba(59, 130, 246, 0.2)', this)"></div>
        <div class="color-dot" style="background: #A855F7;" onclick="changeUITheme('#A855F7', 'rgba(168, 85, 247, 0.2)', this)"></div>
        <div class="color-dot" style="background: #F59E0B;" onclick="changeUITheme('#F59E0B', 'rgba(245, 158, 11, 0.2)', this)"></div>
    </div>

    <div class="form-group">
        <label>Upload Logo Klinik / Praktik</label>
        <input type="file" id="logoUploader" accept="image/png, image/jpeg, image/jpg" onchange="processLogoImageFile(this)">
    </div>

    <div class="form-group">
        <label>Nama Pelanggan / Pasien</label>
        <input type="text" id="namaPasien" placeholder="Masukkan nama lengkap">
    </div>

    <div class="form-group">
        <label>Nomor HP / WhatsApp</label>
        <input type="tel" id="nomorHp" placeholder="Contoh: 081234567xxx">
    </div>

    <div class="form-group">
        <label>Potongan Diskon (Rp)</label>
        <input type="number" id="diskonHarga" placeholder="0" value="0" oninput="calculateLiveTotalBill()">
    </div>

    <div class="form-group">
        <label>Kategori & Layanan Treatment</label>
        <div class="category-tabs" id="categoryTabsLayout"></div>
        
        <div class="scroll-wrapper">
            <div class="service-list" id="serviceContainer"></div>
            <div class="scroll-navigation-panel">
                <button class="scroll-btn" onclick="scrollServiceList('up')">▲</button>
                <button class="scroll-btn" onclick="scrollServiceList('down')">▼</button>
            </div>
        </div>
    </div>

    <div class="live-total-panel">
        <span class="live-total-label">Total Pembayaran</span>
        <span class="live-total-value" id="liveTotalDisplay">Rp 0</span>
    </div>

    <button class="btn-block" onclick="generatePremiumInvoicePDF()">Cetak PDF Kwitansi</button>
    <button class="btn-block btn-secondary" onclick="saveCustomerToRecap()">Simpan ke Rekapan Data</button>
</div>

<div class="recap-container">
    <div class="recap-content">
        <div class="recap-header">
            <h3>📋 Rekapan Data Pelanggan</h3>
            <div class="recap-action-buttons">
                <button class="scroll-btn" style="width: auto; padding: 4px 10px; background: #10b981; border: none; color: white; font-weight: bold;" onclick="exportRecapToExcelXML()">Cetak Excel</button>
            </div>
        </div>
        
        <div class="recap-list" id="recapListContainer"></div>

        <div class="security-section">
            <button class="scroll-btn" style="width: 48%; background: #3b82f6; border: none; color: white;" onclick="backupDatabaseToJSON()">Backup Data</button>
            <button class="scroll-btn" style="width: 48%; background: #a855f7; border: none; color: white;" onclick="triggerImportFileInput()">Import Data</button>
            <input type="file" id="importFileSource" class="hidden-file-input" accept=".json" onchange="importDatabaseFromJSON(this)">
        </div>
        <div style="text-align: right; margin-top: 8px;">
            <button class="scroll-btn" style="width: auto; padding: 2px 8px; display: inline-block;" onclick="clearAllRecapRecords()">Hapus Semua Riwayat</button>
        </div>
    </div>
</div>

<script>
    let currentThemeHex = "#FF5A79";

    // Dataset Layanan Medis
    const medicalServicesDataset = {
        "IBU": [
            { name: "Massage Ibu Hamil", price: 80000 },
            { name: "Massage Ibu Nifas", price: 80000 },
            { name: "Massage Laktasi", price: 80000 },
            { name: "Massage Induksi", price: 80000 },
            { name: "Harmony Spa", price: 105000 },
            { name: "Blooming Spa", price: 115000 },
            { name: "Serenity Bump Package", price: 115000 },
            { name: "Blooming Mama Package", price: 125000 },
            { name: "Adzkiya Glow Package", price: 135000 },
            { name: "Perawatan Luka Perineum", price: 100000 },
            { name: "Perawatan Luka Post Sc", price: 120000 }
        ],
        "BAYI 0-12 BULAN": [
            { name: "Sleepwell Massage", price: 50000 },
            { name: "Pijat Bapil", price: 60000 },
            { name: "Pijat Diare", price: 60000 },
            { name: "Pijat Sembelit", price: 60000 },
            { name: "Pijat Tuina", price: 60000 },
            { name: "Therapy Bapil", price: 80000 },
            { name: "Baby Haircut", price: 25000 },
            { name: "Newborn Care 3 Days", price: 255000 },
            { name: "Newborn Care 5 Days", price: 425000 }
        ],
        "ANAK (KIDS)": [
            { name: "Sleepwell Massage (1-3 Th)", price: 50000 },
            { name: "Sleepwell Massage (4-5 Th)", price: 50000 },
            { name: "Pijat Bapil (Kids)", price: 60000 },
            { name: "Therapy Bapil (Kids)", price: 85000 }
        ],
        "MOM AND NEW BORN": [
            { name: "Mom & Newborn Care 5 Days", price: 550000 },
            { name: "Mom & Newborn Care 7 Days", price: 750000 }
        ]
    };

    let selectedServices = [];
    let base64LogoDataStream = ""; 

    function processLogoImageFile(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64LogoDataStream = e.target.result;
                const uiWatermark = document.getElementById('uiWatermarkView');
                uiWatermark.src = base64LogoDataStream;
                uiWatermark.style.display = "block";
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function changeUITheme(primaryColor, glowColor, element) {
        currentThemeHex = primaryColor;
        document.documentElement.style.setProperty('--theme-color', primaryColor);
        document.documentElement.style.setProperty('--theme-glow', glowColor);
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        element.classList.add('active');
    }

    function toggleUIVisualMode() {
        document.body.classList.toggle('light-mode');
    }

    function scrollServiceList(direction) {
        const container = document.getElementById('serviceContainer');
        if (direction === 'up') container.scrollBy({ top: -50, behavior: 'smooth' });
        else container.scrollBy({ top: 50, behavior: 'smooth' });
    }

    function initializeAppCore() {
        const tabsContainer = document.getElementById('categoryTabsLayout');
        const serviceContainer = document.getElementById('serviceContainer');
        
        let isFirst = true;
        for (const category in medicalServicesDataset) {
            const categoryId = category.replace(/[^a-zA-Z0-9]/g, '-');
            
            const tabBtn = document.createElement('button');
            tabBtn.className = `tab-btn ${isFirst ? 'active' : ''}`;
            tabBtn.innerText = category;
            tabBtn.onclick = () => switchCategoryTab(categoryId, tabBtn);
            tabsContainer.appendChild(tabBtn);

            const pane = document.createElement('div');
            pane.className = `menu-pane ${isFirst ? 'active' : ''}`;
            pane.id = `pane-${categoryId}`;

            medicalServicesDataset[category].forEach(srv => {
                const item = document.createElement('div');
                item.className = 'service-item';
                
                const chk = document.createElement('input');
                chk.type = 'checkbox';
                chk.onchange = () => toggleServiceSelection(srv, category, chk, item);

                const label = document.createElement('span');
                label.innerText = `${srv.name} (Rp ${srv.price.toLocaleString('id-ID')})`;

                item.appendChild(chk);
                item.appendChild(label);
                item.onclick = (e) => {
                    if (e.target !== chk) {
                        chk.checked = !chk.checked;
                        toggleServiceSelection(srv, category, chk, item);
                    }
                };
                pane.appendChild(item);
            });

            serviceContainer.appendChild(pane);
            isFirst = false;
        }
        loadRecapRecords();
    }

    function switchCategoryTab(categoryId, btn) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.menu-pane').forEach(p => p.classList.remove('active'));
        document.getElementById(`pane-${categoryId}`).classList.add('active');
    }

    function toggleServiceSelection(service, category, checkbox, itemElement) {
        if (checkbox.checked) {
            itemElement.classList.add('selected');
            if (!selectedServices.some(s => s.name === service.name)) {
                selectedServices.push({ ...service, category: category });
            }
        } else {
            itemElement.classList.remove('selected');
            selectedServices = selectedServices.filter(s => s.name !== service.name);
        }
        calculateLiveTotalBill();
    }

    function calculateLiveTotalBill() {
        let total = selectedServices.reduce((sum, s) => sum + s.price, 0);
        const diskon = parseInt(document.getElementById('diskonHarga').value) || 0;
        total = Math.max(0, total - diskon);
        document.getElementById('liveTotalDisplay').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    // --- REKAPAN DATA (LocalStorage) ---
    function saveCustomerToRecap() {
        const nama = document.getElementById('namaPasien').value.trim();
        const telp = document.getElementById('nomorHp').value.trim();
        const diskon = parseInt(document.getElementById('diskonHarga').value) || 0;
        
        if (!nama) {
            alert("Silakan masukkan Nama Pelanggan terlebih dahulu.");
            return;
        }
        if (selectedServices.length === 0) {
            alert("Silakan pilih minimal satu layanan treatment.");
            return;
        }

        let totalLayanan = selectedServices.reduce((sum, s) => sum + s.price, 0);
        let totalAkhir = Math.max(0, totalLayanan - diskon);
        const daftarLayananText = selectedServices.map(s => s.name).join(", ");

        const recordBaru = {
            id: Date.now(),
            nama: nama,
            telp: telp || "-",
            layanan: daftarLayananText,
            total: totalAkhir,
            tanggal: new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' })
        };

        let dataRekap = localStorage.getItem("adzkiya_recap_data");
        dataRekap = dataRekap ? JSON.parse(dataRekap) : [];
        dataRekap.unshift(recordBaru);
        localStorage.setItem("adzkiya_recap_data", JSON.stringify(dataRekap));

        loadRecapRecords();
        resetMainInputForm();
        alert("Data pelanggan berhasil disimpan secara permanen!");
    }

    function loadRecapRecords() {
        const container = document.getElementById("recapListContainer");
        container.innerHTML = "";
        
        let dataRekap = localStorage.getItem("adzkiya_recap_data");
        dataRekap = dataRekap ? JSON.parse(dataRekap) : [];

        if (dataRekap.length === 0) {
            container.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--text-sub); padding:15px; opacity:0.7;">Belum ada data rekapan tersimpan.</div>`;
            return;
        }

        dataRekap.forEach(item => {
            const card = document.createElement("div");
            card.className = "recap-item";
            card.innerHTML = `
                <button class="btn-delete" onclick="deleteRecapItem(${item.id})">✕</button>
                <div class="name">${item.nama} <span style="font-weight:normal; font-size:10px; color:var(--text-sub);">(${item.tanggal})</span></div>
                <div class="details">📞 Telp: ${item.telp}</div>
                <div class="details">💆 Treatment: ${item.layanan}</div>
                <div class="price">Rp ${item.total.toLocaleString('id-ID')}</div>
            `;
            container.appendChild(card);
        });
    }

    function deleteRecapItem(id) {
        if(confirm("Hapus item data rekapan ini?")) {
            let dataRekap = JSON.parse(localStorage.getItem("adzkiya_recap_data")) || [];
            dataRekap = dataRekap.filter(item => item.id !== id);
            localStorage.setItem("adzkiya_recap_data", JSON.stringify(dataRekap));
            loadRecapRecords();
        }
    }

    function clearAllRecapRecords() {
        if(confirm("Apakah Anda yakin ingin menghapus TOTAL seluruh riwayat rekapan lokal?")) {
            localStorage.removeItem("adzkiya_recap_data");
            loadRecapRecords();
        }
    }

    // --- MODUL FITUR BACKUP & IMPORT DATABASE (MENGAMANKAN DATA) ---
    function backupDatabaseToJSON() {
        let dataRekap = localStorage.getItem("adzkiya_recap_data");
        if (!dataRekap || JSON.parse(dataRekap).length === 0) {
            alert("Tidak ada data rekapan yang bisa di-backup saat ini.");
            return;
        }

        const blob = new Blob([dataRekap], { type: "application/json;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `BACKUP_REKAP_ADZKIYA_${Date.now()}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function triggerImportFileInput() {
        document.getElementById('importFileSource').click();
    }

    function importDatabaseFromJSON(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (!Array.isArray(importedData)) {
                        throw new Error("Format database tidak valid.");
                    }

                    if (confirm(`Menemukan ${importedData.length} baris riwayat data rekapan. Gabungkan dengan data lokal saat ini?`)) {
                        let localData = localStorage.getItem("adzkiya_recap_data");
                        localData = localData ? JSON.parse(localData) : [];

                        // Menghindari duplikasi id data
                        let mergedData = [...importedData, ...localData];
                        let uniqueData = [];
                        let checkedIds = {};

                        mergedData.forEach(item => {
                            if (!checkedIds[item.id]) {
                                uniqueData.push(item);
                                checkedIds[item.id] = true;
                            }
                        });

                        localStorage.setItem("adzkiya_recap_data", JSON.stringify(uniqueData));
                        loadRecapRecords();
                        alert("Database berhasil di-import dan disinkronisasikan!");
                    }
                } catch (err) {
                    alert("Gagal membaca file backup. Pastikan file berupa berkas .json resmi dari aplikasi ini.");
                }
                // Reset file input agar bisa upload file yang sama jika diinginkan
                input.value = "";
            };
            reader.readAsText(input.files[0]);
        }
    }

    function resetMainInputForm() {
        document.getElementById('namaPasien').value = "";
        document.getElementById('nomorHp').value = "";
        document.getElementById('diskonHarga').value = "0";

    }

    function hexToRgbArray(hex) {
        let c = hex.substring(1);
        if(c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
        let r = parseInt(c.substring(0,2), 16);
        let g = parseInt(c.substring(2,4), 16);
        let b = parseInt(c.substring(4,6), 16);
        return [r, g, b];
    }
